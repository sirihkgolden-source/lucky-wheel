<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生重來模擬器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px;
      background-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #2d3748;
    }
    .game-card {
      max-width: 580px;
      margin: 10px auto;
      padding: 22px;
      border-radius: 12px;
      background-color: #f9f9fb;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      line-height: 1.6;
    }
    .game-title { text-align: center; color: #1a202c; margin-bottom: 5px; font-size: 1.5em; }
    .game-subtitle { text-align: center; font-size: 0.85em; color: #718096; margin-bottom: 15px; }
    .stat-box {
      background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 12px; margin-bottom: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.9em;
    }
    .event-text {
      font-size: 1.05em; margin: 15px 0; min-height: 85px; padding: 12px; background: #ffffff; border-left: 4px solid #3182ce; border-radius: 4px;
    }
    .btn-container { display: flex; flex-direction: column; gap: 10px; }
    .custom-btn {
      background-color: #3182ce; color: white; padding: 12px 16px;
      border-radius: 6px; font-size: 0.95em; cursor: pointer; transition: background-color 0.2s;
      text-align: left; user-select: none;
    }
    .custom-btn:hover { background-color: #2b6cb0; }
    .btn-restart { background-color: #e53e3e; text-align: center; }
    .btn-restart:hover { background-color: #c53030; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; background: #edf2f7; color: #2b6cb0; }
  </style>
</head>

  <h2 class="game-title">80億分之1 人生重來模擬器</h2>
  <div class="game-subtitle">真實全球機率版 每5年一次重大命運抉擇</div>
  <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 10px 0;">

  <div id="character-info" class="stat-box" style="display:none;">
    <div>出生地點 <span id="country-name" class="badge">---</span></div>
    <div>家庭背景 <span id="family-bg" class="badge">---</span></div>
    <div>當前年齡 <span id="current-age" class="badge">0</span> 歲</div>
    <div>健康狀況 <span id="player-health" class="badge">正常</span></div>
    <div>財富水準 <span id="player-wealth" class="badge">普通</span></div>
    <div>快樂指數 <span id="player-happy" class="badge">平穩</span></div>
  </div>

  <div id="event-display" class="event-text">
    點擊下方按鈕開始 隨機投胎展開你的一生
  </div>

  <div id="action-buttons" class="btn-container">
    <div class="custom-btn btn-restart" id="start-btn">開始投胎</div>
  </div>
</div>

function updateStats() {
  document.getElementById("current-age").innerText = player.age;
  document.getElementById("player-health").innerText = player.health > 70 ? "強健" : player.health > 40 ? "正常" : "虛弱";
  document.getElementById("player-wealth").innerText = player.wealth > 70 ? "富裕" : player.wealth > 40 ? "小康" : "拮据";
  document.getElementById("player-happy").innerText = player.happy > 70 ? "愉悦" : player.happy > 40 ? "平穩" : "低落";
}

function getRandomCountry() {
  var totalProb = 0;
  for (var i = 0; i < countriesData.length; i++) {
    totalProb += countriesData[i].prob;
  }
  var rand = Math.random() * totalProb;
  var currentSum = 0;
  for (var i = 0; i < countriesData.length; i++) {
    currentSum += countriesData[i].prob;
    if (rand <= currentSum) {
      return countriesData[i];
    }
  }
  return countriesData[0];
}

function startNewLife() {
  var country = getRandomCountry();
  var bg = country.bg[Math.floor(Math.random() * country.bg.length)];
  
  player = { 
    country: country.name, lifeExp: country.lifeExp, childMortality: country.childMortality,
    bg: bg, age: 0, health: 85, wealth: 50, happy: 75
  };

  currentStageIndex = 0;
  document.getElementById("character-info").style.display = "grid";
  document.getElementById("country-name").innerText = player.country;
  document.getElementById("family-bg").innerText = player.bg;
  updateStats();

  if (Math.random() * 100 < player.childMortality) {
    document.getElementById("event-display").innerText = "悲劇 夭折";
    renderRestartButton();
  } else {
    document.getElementById("event-display").innerText = "平安度過幼兒期";
    renderNextButton("進入下一階段", nextStage);
  }
}

function nextStage() {
  if (currentStageIndex >= stages.length) {
    finalEnding();
    return;
  }

  var stg = stages[currentStageIndex];
  player.age = stg.age;
  updateStats();

  var randomEventText = "";
  if (Math.random() < 0.35 && currentStageIndex > 1) {
    var events = [
      " 獲得好名聲",
      " 投資獲得小財",
      " 感冒休息幾天",
      " 結交摯友"
    ];
    randomEventText = events[Math.floor(Math.random() * events.length)];
  }

  document.getElementById("event-display").innerText = stg.title + " " + stg.desc + randomEventText;

  var btns = stg.choices.map(function(c) {
    return {
      text: c.text,
      action: function() {
        player.health += c.h;
        player.wealth += c.w;
        player.happy += c.k;
        
        if (player.health < 0) player.health = 0;
        if (player.wealth < 0) player.wealth = 0;
        if (player.happy < 0) player.happy = 0;
        
        if (player.health <= 0) {
          triggerEarlyDeath();
        } else {
          currentStageIndex++;
          nextStage();
        }
      }
    };
  });

  renderChoices(btns);
}

function triggerEarlyDeath() {
  document.getElementById("event-display").innerText = "健康耗盡 提早離世";
  renderRestartButton();
}

function finalEnding() {
  var bonus = Math.floor((player.health - 50) / 4);
  player.age = player.lifeExp + bonus;
  if (player.age > 102) player.age = 102;
  updateStats();
  
  // 使用最單純不帶任何特殊符號與變數拼接的固定結論文案
  document.getElementById("event-display").innerText = "你的人生已經順利走完全程 感謝你的體驗";
  renderRestartButton();
}

function renderNextButton(text, callback) {
  var container = document.getElementById("action-buttons");
  container.innerHTML = "";
  var btn = document.createElement("div");
  btn.className = "custom-btn btn-restart";
  btn.innerText = text;
  btn.onclick = callback;
  container.appendChild(btn);
}

function renderRestartButton() {
  var container = document.getElementById("action-buttons");
  container.innerHTML = "";
  var btn = document.createElement("div");
  btn.className = "custom-btn btn-restart";
  btn.innerText = "再次投胎";
  btn.onclick = startNewLife;
  container.appendChild(btn);
}

function renderChoices(choices) {
  var container = document.getElementById("action-buttons");
  container.innerHTML = "";
  choices.forEach(function(c) {
    var btn = document.createElement("div");
    btn.className = "custom-btn";
    btn.innerText = c.text;
    btn.onclick = c.action;
    container.appendChild(btn);
  });
}

document.getElementById("start-btn").onclick = startNewLife;
