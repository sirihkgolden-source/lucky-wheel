<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    .game-card {
      max-width: 580px;
      margin: 20px auto;
      padding: 25px;
      border-radius: 12px;
      background-color: #f9f9fb;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #2d3748;
      line-height: 1.6;
    }
    .game-title { text-align: center; color: #1a202c; margin-bottom: 5px; font-size: 1.6em; }
    .game-subtitle { text-align: center; font-size: 0.9em; color: #718096; margin-bottom: 20px; }
    .stat-box {
      background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 15px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.95em;
    }
    .event-text {
      font-size: 1.08em; margin: 20px 0; min-height: 90px; padding: 12px; background: #ffffff; border-left: 4px solid #3182ce; border-radius: 4px;
    }
    .btn-container { display: flex; flex-direction: column; gap: 10px; }
    .custom-btn {
      background-color: #3182ce; color: white; padding: 12px 20px;
      border-radius: 6px; font-size: 1em; cursor: pointer; transition: background-color 0.2s;
      text-align: left; user-select: none; -webkit-user-select: none;
    }
    .custom-btn:hover { background-color: #2b6cb0; }
    .btn-restart { background-color: #e53e3e; text-align: center; }
    .btn-restart:hover { background-color: #c53030; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; background: #edf2f7; color: #2b6cb0; }
  </style>
</head>
<body>

<div class="game-card">
  <h2 class="game-title">80億分之1 人生重來模擬器</h2>
  <div class="game-subtitle">超長體驗版 每5年一次重大命運抉擇</div>
  <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">

  <div id="character-info" class="stat-box" style="display:none;">
    <div>出生地點: <span id="country-name" class="badge">---</span></div>
    <div>家庭背景: <span id="family-bg" class="badge">---</span></div>
    <div>當前年齡: <span id="current-age" class="badge">0</span> 歲</div>
    <div>健康狀況: <span id="player-health" class="badge">正常</span></div>
    <div>財富水準: <span id="player-wealth" class="badge">普通</span></div>
    <div>快樂指數: <span id="player-happy" class="badge">平穩</span></div>
  </div>

  <div id="event-display" class="event-text">
    點擊下方按鈕開始 隨機投胎展開你的一生...
  </div>

  <div id="action-buttons" class="btn-container">
    <div class="custom-btn btn-restart" onclick="window.startNewLife()">開始投胎</div>
  </div>
</div>

function updateStats() {
  document.getElementById("current-age").innerText = player.age;
  document.getElementById("player-health").innerText = player.health > 70 ? "強健" : player.health > 40 ? "正常" : "虛弱";
  document.getElementById("player-wealth").innerText = player.wealth > 70 ? "富裕" : player.wealth > 40 ? "小康" : "拮据";
  document.getElementById("player-happy").innerText = player.happy > 70 ? "愉悦" : player.happy > 40 ? "平穩" : "低落";
}

window.startNewLife = function() {
  var country = countriesData[Math.floor(Math.random() * countriesData.length)];
  var bg = country.bg[Math.floor(Math.random() * country.bg.length)];
  
  player = { 
    country: country.name, 
    lifeExp: country.lifeExp, 
    childMortality: country.childMortality, 
    bg: bg, 
    age: 0,
    health: 80,
    wealth: 50,
    happy: 70
  };

  currentStageIndex = 0;
  document.getElementById("character-info").style.display = "grid";
  document.getElementById("country-name").innerText = player.country;
  document.getElementById("family-bg").innerText = player.bg;
  updateStats();

  if (Math.random() * 100 < player.childMortality) {
    document.getElementById("event-display").innerText = "悲劇！你出生在 " + player.country + " (" + player.bg + ") 因醫療資源不足在 5 歲前不幸夭折.";
    renderRestartButton();
  } else {
    document.getElementById("event-display").innerText = "你順利降生在 " + player.country + " 的 " + player.bg + " 平安度過了幼兒期.";
    renderNextButton("進入 5 歲 幼兒成長期", window.nextStage);
  }
};

window.nextStage = function() {
  if (currentStageIndex >= stages.length) {
    finalEnding();
    return;
  }

  var stg = stages[currentStageIndex];
  player.age = stg.age;
  updateStats();

  document.getElementById("event-display").innerText = stg.title + " - " + stg.desc;

  var btns = stg.choices.map(function(c) {
    return {
      text: c.text,
      action: function() {
        player.health += c.h;
        player.wealth += c.w;
        player.happy += c.k;
        currentStageIndex++;
        window.nextStage();
      }
    };
  });

  renderChoices(btns);
};

function finalEnding() {
  player.age = player.lifeExp + Math.floor((player.health - 50) / 5);
  updateStats();
  
  var resultMsg = "人生終點: 你在 " + player.country + " 度過了充實的一生 享年 " + player.age + " 歲.";
  
  if (player.wealth > 80 && player.happy > 80) {
    resultMsg += " 你成就非凡、財富充沛且晚年無比幸福 是人人稱羨的人生贏家！";
  } else if (player.health > 80) {
    resultMsg += " 你一生非常注重養生 保有健康的體魄 享受了極高品質的長壽人生.";
  } else if (player.wealth > 80) {
    resultMsg += " 你一生勤奮打拚 積累了豐厚的家產 為子孫打下堅實基礎.";
  } else if (player.happy > 80) {
    resultMsg += " 你心態豁達樂觀 一生充滿歡笑 活過了最真實自在的自己.";
  } else {
    resultMsg += " 你歷經了無數個5年的抉擇與風吹雨打 平淡而真實地寫下了屬於你的人生篇章.";
  }

  document.getElementById("event-display").innerText = resultMsg;
  renderRestartButton();
}

function renderNextButton(text, callback) {
  var container = document.getElementById("action-buttons");
  container.innerHTML = "";
  var btn = document.createElement("div");
  btn.className = "custom-btn btn-restart";
  btn.innerText = text;
  btn.onclick = callback;
  container.appendChild(btn);
}

function renderRestartButton() {
  var container = document.getElementById("action-buttons");
  container.innerHTML = "";
  var btn = document.createElement("div");
  btn.className = "custom-btn btn-restart";
  btn.innerText = "重新投胎";
  btn.onclick = window.startNewLife;
  container.appendChild(btn);
}

function renderChoices(choices) {
  var container = document.getElementById("action-buttons");
  container.innerHTML = "";
  choices.forEach(function(c) {
    var btn = document.createElement("div");
    btn.className = "custom-btn";
    btn.innerText = c.text;
    btn.onclick = c.action;
    container.appendChild(btn);
  });
}
</script>

</body>
</html>
